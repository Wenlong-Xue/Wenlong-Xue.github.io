<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Local structure and transport</title>
  <desc id="desc">Abstract scattering rings, coordination sites, and transport pathways.</desc>
